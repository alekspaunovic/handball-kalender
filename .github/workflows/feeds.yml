name: Feeds aktualisieren

# SPEC.md Abschnitt 11: alle sechs Stunden per Zeitplan plus manueller
# Trigger. Liest die SpielerPlus-URLs aus GitHub Secrets, erzeugt die Feeds
# in docs/ und committet docs/ und data/ zurueck ins Repository.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -e .

      - name: Feeds erzeugen
        env:
          SPIELERPLUS_M2: ${{ secrets.SPIELERPLUS_M2 }}
          SPIELERPLUS_M3: ${{ secrets.SPIELERPLUS_M3 }}
        run: python -m handball_kalender.main

      - name: docs/ und data/ committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an den Feeds."
          else
            git commit -m "Feeds aktualisieren"
            git push
          fi
